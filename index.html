<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>5 ejercicios (16-20)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('../Grupo de Actividades (2do Trimestre)/images/Fondo 2.jpg');
            background-size: cover;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 { margin-top: 50px; color: #00d4ff; }

        select, button {
            padding: 10px 20px;
            margin: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }

        select { background: #eee; color: #333; }

        button {
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        #btnStart { background: #00d4ff; }
        #btnStart:hover { background: #0099bb; }

        #btnTest { background: #ff9f00; }
        #btnTest:hover { background: #e68a00; }

        #btnAllTests { background: #6f42c1; }
        #btnAllTests:hover { background: #59359a; }

        .lineas-decorativas hr {
            border: 0;
            height: 1px;
            background: #00d4ff;
            margin: 5px auto;
        }

        #resultados {
            margin-top: 30px;
            min-height: 100px;
            display: inline-block;
            width: 80%;
            max-width: 600px;
        }
    </style>
</head>
<body>

    <h1>Ejercicios (16-20)</h1>
    <hr width="90%" style="opacity: 0.3;">

    <p><i>Seleccione la actividad que desea ejecutar:</i></p>

    <select id="actividades">
        <option value="clear"> -- Selecciona una Actividad -- </option>
        <option value="Act 16">Actividad 16</option>
        <option value="Act 17">Actividad 17</option>
        <option value="Act 18">Actividad 18</option>
        <option value="Act 19">Actividad 19</option>
        <option value="Act 20">Actividad 20</option>
    </select>

    <br>
    <button id="btnStart">Empezar Actividad 🚀</button>
    <button id="btnTest">Realizar Test Unitario 📝</button>
    <button id="btnAllTests">Test General 📊</button>

    <div class="lineas-decorativas" style="margin-top: 40px;">
        <hr width="50%">
        <hr width="30%">
    </div>

    <div id="resultados"></div>

    <script type="module" src="The-Ejecutor.js"></script>

</body>
</html>
