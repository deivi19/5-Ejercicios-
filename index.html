<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                    url('./images/fondo-2.jpg');
        background-size: cover;
        background-attachment: fixed;
        color: white;
        text-align: center;
        margin: 0;
        padding: 20px;
        /* Asegura que el contenido pueda crecer pero se mantenga alineado */
        display: flex;
        flex-direction: column;
        align-items: center; 
    }

    h1 { margin-top: 50px; color: #00d4ff; }

    /* Contenedor para los botones para que no se desparramen */
    .controles {
        margin: 20px 0;
    }

    select, button {
        padding: 10px 20px;
        margin: 10px;
        border-radius: 5px;
        border: none;
        font-size: 16px;
    }

    select { background: #eee; color: #333; cursor: pointer; }

    button {
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    #btnStart { background: #00d4ff; }
    #btnStart:hover { background: #0099bb; }

    #btnTest { background: #ff9f00; }
    #btnTest:hover { background: #e68a00; }

    #btnAllTests { background: #6f42c1; }
    #btnAllTests:hover { background: #59359a; }

    /* Ajuste crítico para el centrado de los resultados */
    #resultados {
        margin-top: 30px;
        width: 100%;
        max-width: 700px;
        display: flex;
        flex-direction: column;
        align-items: center; /* Centra los hijos (los cuadros de test) */
        text-align: center;
    }

    /* Estilo para los bloques de test dentro de resultados */
    #resultados > div {
        width: 100%; /* Para que respeten el max-width del padre */
        box-sizing: border-box;
    }
</style>

<body>

    <h1>Ejercicios (16-20)</h1>
    <hr width="90%" style="opacity: 0.3;">

    <p><i>Seleccione la actividad para ejecutar o testear:</i></p>

    <div class="controles">
        <select id="actividades">
            <option value="clear"> -- Selecciona una Actividad -- </option>
            <option value="Act 16">Actividad 16</option>
            <option value="Act 17">Actividad 17</option>
            <option value="Act 18">Actividad 18</option>
            <option value="Act 19">Actividad 19</option>
            <option value="Act 20">Actividad 20</option>
        </select>

        <br>
        <button id="btnStart">Empezar Actividad 🚀</button>
        <button id="btnTest">Realizar Test Unitario 📝</button>
        <button id="btnAllTests">Test General 📊</button>
    </div>

    <div id="resultados"></div>

    <script type="module" src="The-Ejecutor.js"></script>

</body>
